function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;}catch(_){storageOK=false;}let el=$('#save-state');if(el)el.textContent=storageOK?'Lokal gespeichert':'Speicher blockiert - JSON sichern';}
function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(save,120);}
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3400);}
function chapterAt(i=S.position){return D.chapters[Math.floor(i/8)];}
function active(){return TASKS[S.position];}
function unlocked(){let i=TASKS.findIndex(t=>!Object.hasOwn(S.answers,t.id));return i<0?TASKS.length-1:i;}
function defaultDraft(t){if(Object.hasOwn(S.drafts,t.id))return S.drafts[t.id];let d;if(Object.hasOwn(S.answers,t.id))d=JSON.parse(JSON.stringify(S.answers[t.id]));else if(['single','reflect'].includes(t.type))d='';else if(t.type==='order')d=C.shuffle(t.items.map(x=>x.id),S.seed+C.hash(t.id));else if(['multi','inspect','portfolio'].includes(t.type))d=[];else d={};S.drafts[t.id]=d;return d;}
function validDraftShape(t,d){if(['single','reflect'].includes(t.type))return typeof d==='string';if(['multi','inspect','portfolio','order'].includes(t.type))return Array.isArray(d);return d!==null&&typeof d==='object'&&!Array.isArray(d);}
function draft(t){let d=defaultDraft(t);if(!validDraftShape(t,d)){delete S.drafts[t.id];d=defaultDraft(t);}if(t.type==='order'&&(d.length!==t.order.length||new Set(d).size!==d.length||d.some(x=>!t.order.includes(x)))){S.drafts[t.id]=C.shuffle(t.items.map(x=>x.id),S.seed+C.hash(t.id));return S.drafts[t.id];}return d;}
function changed(t){return Object.hasOwn(S.answers,t.id)&&JSON.stringify(draft(t))!==JSON.stringify(S.answers[t.id]);}
function dirtyCount(){return TASKS.filter(t=>Object.hasOwn(S.answers,t.id)&&Object.hasOwn(S.drafts,t.id)&&JSON.stringify(S.drafts[t.id])!==JSON.stringify(S.answers[t.id])).length;}
function status(msg='',err=false){let x=$('#status');if(x){x.textContent=msg||((changed(active()))?'Entwurf geändert - bitte erneut speichern.':Object.hasOwn(S.answers,active().id)?'Entscheidung gespeichert. Bewertung erst nach Missionsabschluss.':'Noch keine Entscheidung gespeichert.');x.classList.toggle('error',err);}}
function optionOrder(t,arr=t.options){return C.shuffle(arr,S.seed+C.hash(t.id));}
function styles(){return `<div class="style-switch" aria-label="Darstellung">${[['cartoon','Comic'],['studio','2,5D'],['adventure','Adventure']].map(([id,s])=>`<button data-act="theme" data-id="${id}" class="${S.theme===id?'active':''}" aria-pressed="${S.theme===id}">${E(s)}</button>`).join('')}</div>`;}
function header(){return `<header class="topbar"><div class="brand"><div class="brandmark">L</div><div><strong>LYRA <span style="font-weight:400">/ UnternehmensMission</span></strong><small>DV BUSINESS SOLUTION | REWE1</small></div></div><nav class="navtools" aria-label="Spielwerkzeuge"><button data-act="home" title="Startseite" aria-label="Startseite">${I('home')} Start</button><button data-act="guide" title="Spielhilfe" aria-label="Spielhilfe">${I('help')} Hilfe</button><button data-act="export" title="Spielstand sichern" aria-label="Spielstand sichern">${I('download')} Sichern</button><button data-act="settings" title="Darstellung und Spielstand" aria-label="Darstellung und Spielstand">${I('settings')} Optionen</button></nav></header>`;}
function stage(c,large=false){return `<div class="scene">${A.scene(c.room,S.theme,S.avatar,D.npcs[c.npc].avatar)}<div class="scene-caption"><span>BÜROWERK | ${E(c.npc)}</span><span>${S.theme==='cartoon'?'Comic':S.theme==='studio'?'Räumlicher 2,5D-Look':'Illustratives Adventure'}</span></div></div>`;}
function routeLabel(){let t=TASKS.find(t=>t.id==='ankunft-02'),a=S.answers[t.id];return t.options.find(x=>x.id===a?.choice)?.text||'Noch kein Schwerpunkt gewählt.';}
function portfolioLabel(){let t=TASKS.find(t=>t.type==='portfolio'),a=S.answers[t.id];return Array.isArray(a)?t.items.filter(x=>a.includes(x.id)).map(x=>x.name).join(' + '):'Noch keine Priorisierung gespeichert.';}
function landing(){const c=D.chapters[0];return `${header()}<main id="main" class="landing"><section class="landing-copy"><div class="eyebrow">Dein Auftrag. Deine Entscheidungen.</div><h1>BüroWerk:<span>Das erste<br>Geschäftsjahr.</span></h1><p>Ein neues Unternehmen braucht eine saubere Buchhaltung. Entdecke Belege, führe Inventur, buche mit SKR04 und löse am Ende einen DATEV-orientierten Trainingsfall.</p><div class="facts"><div><strong>9</strong><small>verbundene Kapitel</small></div><div><strong>72</strong><small>Schritte und Aufträge</small></div><div><strong>90-120</strong><small>Minuten als Lernziel</small></div></div><div class="row"><button class="primary" data-act="start">${I('play')}${S.started?(S.finished?'Abschlussbesprechung öffnen':'Mission fortsetzen'):'Meine Spielfigur erstellen'}</button><button data-act="import">${I('upload')}Spielstand laden</button></div><div class="gap">${styles()}</div><p class="small muted gap">Einzelspieler | Offline | Module 01–09<br>Keine Lösungen oder Punktebewertung während der Mission. Allgemeine Hilfen, Formeln und Taschenrechner bleiben verfügbar.</p>${!storageOK?'<div class="error-box">Dein Browser blockiert die lokale Speicherung. Sichere regelmäßig einen JSON-Spielstand.</div>':''}</section><section>${stage(c,true)}<div class="callout gap"><strong>Miras Auftrag</strong><p>"Ich brauche nachvollziehbare Belege, saubere Buchungen und einen Abschluss, der wirklich aufgeht."</p></div></section></main><footer class="footerline">Quellenbasiertes Lernspiel mit fiktiver Rahmengeschichte. Keine realen Unternehmensdaten. <button class="quiet" data-act="sources">Quellen und Modellgrenzen</button></footer>`;}
function creator(){const selects=[['skin','Hautton',6],['hair','Frisur',6],['hairColor','Haarfarbe',6],['outfit','Kleidung',8],['accessory','Accessoire',5]];return `${header()}<main id="main" class="creator"><div class="avatar-preview" id="avatar-preview">${A.avatar(S.avatar,S.theme,'Deine Spielfigur')}</div><section class="card"><div class="eyebrow">Willkommen im Team</div><h1 class="gap">Dein Platz bei BüroWerk.</h1><p class="muted">Wähle einen Namen und gestalte deine Figur. Ein Spitzname genügt; alles bleibt in diesem Browser oder deinem exportierten Spielstand.</p><label class="field">Dein Name<input id="player-name" data-avatar="name" maxlength="32" autocomplete="off" value="${E(S.avatar.name)}" placeholder="z. B. Alex"></label><div class="formgrid gap">${selects.map(([k,label,n])=>`<label class="field">${label}<select data-avatar="${k}">${Array.from({length:n},(_,i)=>`<option value="${i}" ${S.avatar[k]===i?'selected':''}>${k==='accessory'&&i===0?'Ohne':label+' '+(i+1)}</option>`).join('')}</select></label>`).join('')}</div><div class="gap">${styles()}</div><div class="callout gap small">Fachaufgaben geben nichtnegative Teilpunkte. Lesen, Schwerpunktwahl und Freitexte dienen der Bearbeitung; sie werden nicht als automatisch richtiges Fachwissen gewertet.</div><button class="primary gap" data-act="begin">${I('arrow')}Auftrag annehmen</button><p class="status" id="creator-error" role="status"></p></section></main>`;}
function sidebar(){let c=chapterAt(),done=C.done(D,S);return `<aside class="sidebar"><div class="playerchip"><div class="portrait">${A.avatar(S.avatar,S.theme,'')}</div><div><strong>${E(S.avatar.name)}</strong><small>Buchhaltungsteam</small></div></div><div class="track" role="progressbar" aria-label="Bearbeitete Schritte" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="72"><span style="width:${done/72*100}%"></span></div><p>${done} / 72 Schritte gespeichert</p><nav class="chapnav" aria-label="Kapitel">${D.chapters.map((ch,i)=>`<button data-act="chapter" data-index="${i}" class="${ch.id===c.id?'current':''}" ${i*8>unlocked()?'disabled':''} aria-label="Kapitel ${i+1}: ${E(ch.title)}"><span class="num">${ch.tasks.every(t=>Object.hasOwn(S.answers,t.id))?I('check',15):i+1}</span><span class="name">${E(ch.title)}</span></button>`).join('')}</nav><div class="side-bottom"><strong>Dein Arbeitsstand</strong><p style="margin:8px 0">Keine Richtig-/Falsch-Anzeige.<br>Deine letzte gespeicherte Entscheidung zählt.</p><span id="save-state">${storageOK?'Lokal gespeichert':'JSON-Sicherung verwenden'}</span></div></aside>`;}
function taskBody(t){const d=draft(t);
 if(t.type==='inspect')return `<div class="documents">${t.evidence.map(e=>`<button class="document" data-act="evidence" data-id="${e.id}">${I(e.kind==='nachricht'?'mail':e.kind==='notiz'?'note':'book',27)}<strong>${E(e.title)}</strong><small>${d.includes(e.id)?'Gelesen - erneut öffnen':'Unterlage öffnen'}</small></button>`).join('')}</div>`;
 if(t.type==='single'||t.type==='multi')return `${t.type==='multi'?`<p class="small muted">Wähle genau ${t.correct.length} Antworten. Jede passende Auswahl kann Teilpunkte geben; keine Minuspunkte.</p>`:''}<div class="choice-list">${optionOrder(t).map((o,i)=>`<label class="choice"><input type="${t.type==='single'?'radio':'checkbox'}" name="choice" data-choice="${o.id}" ${t.type==='single'?(d===o.id?'checked':''):(d.includes(o.id)?'checked':'')}><span>${E(o.text)}</span></label>`).join('')}</div>`;
 if(t.type==='numbers')return `<p class="small muted">Beträge in Euro, nicht in Tausend. Dezimalkomma oder -punkt; zwei Nachkommastellen genügen. Tausenderpunkt: 1.000 = tausend.</p><div class="numeric-grid">${t.fields.map(x=>`<label class="field" for="num-${x.id}">${E(x.label)}<input id="num-${x.id}" data-number="${x.id}" inputmode="decimal" autocomplete="off" maxlength="40" placeholder="Dein Ergebnis" value="${E(d[x.id]??'')}"><small>${E(x.unit)}</small></label>`).join('')}</div>`;
 if(t.type==='match')return t.pairs.map(p=>`<div class="match-row"><label for="match-${p.id}">${E(p.text)}</label><select id="match-${p.id}" data-match="${p.id}"><option value="">Bitte zuordnen ...</option>${C.shuffle(t.categories,S.seed+C.hash(t.id+p.id)).map(k=>`<option value="${k.id}" ${d[p.id]===k.id?'selected':''}>${E(k.text)}</option>`).join('')}</select></div>`).join('');
 if(t.type==='order')return `<p class="small muted">Verschiebe die Karten mit den Pfeilen. Die Startreihenfolge ist gemischt.</p><ol class="order-list">${d.map((id,i)=>`<li><span>${E(t.items.find(x=>x.id===id).text)}</span><button class="icon" data-act="order" data-index="${i}" data-direction="-1" ${i===0?'disabled':''} aria-label="Schritt ${i+1} nach oben">${I('up',18)}</button><button class="icon" data-act="order" data-index="${i}" data-direction="1" ${i===d.length-1?'disabled':''} aria-label="Schritt ${i+1} nach unten">${I('down',18)}</button></li>`).join('')}</ol>`;
 if(t.type==='reflect')return `<label class="field">Deine Begründung<textarea class="response-area" data-reflect maxlength="4000" placeholder="Mein Befund ... Meine Empfehlung ... Noch zu prüfen ...">${E(d)}</textarea></label><p class="small muted">Mindestens ${t.minChars} Zeichen. Dein Text wird erst in der Besprechung fachlich eingeordnet.</p>`;
 if(t.type==='dialogue'){let o=t.options.find(x=>x.id===d.choice);return `<div class="choice-list">${t.options.map(x=>`<button class="choice ${d.choice===x.id?'active':''}" data-act="dialogue" data-id="${x.id}">${I('mail')}<span>${E(x.text)}</span></button>`).join('')}</div>${o?`<div class="reply" role="status"><p>${E(o.reply)}</p></div><label class="choice"><input type="checkbox" data-read ${d.read?'checked':''}><span>Antwort gelesen. Diesen Schwerpunkt festhalten.</span></label>`:''}`;}
 if(t.type==='portfolio')return `<div class="choice-list">${t.items.map(x=>`<label class="choice"><input type="checkbox" data-portfolio="${x.id}" ${d.includes(x.id)?'checked':''}><span><strong>${E(x.name)}</strong><small>${f(x.price)} Euro beantragtes Projektvolumen</small></span></label>`).join('')}</div><p class="small muted gap">Die Kriterien aus der Prüfnotiz sind offen. Es gibt hier keine laufende Bewertung deiner Auswahl.</p>`;
 return '';
}
function game(){let c=chapterAt(),t=active(),step=S.position%8;return `${header()}<div class="layout">${sidebar()}<main id="main" class="main"><div class="chapterhead"><div class="eyebrow">Kapitel ${Math.floor(S.position/8)+1} / 9</div><h1>${E(c.title)}</h1><p>${E(c.subtitle)}</p></div><div class="stage">${stage(c)}<div class="speech"><div class="npc">${E(c.npc)} <span>| ${E(D.npcs[c.npc].role)}</span></div><p>${E(step===0?c.intro:c.goal)}</p>${step===0&&S.position>8?`<p class="small muted">Dein Schwerpunkt: ${E(routeLabel())}</p>`:''}</div></div><div class="row spread taskmeta"><div class="stepdots" aria-label="Schritte im Kapitel">${c.tasks.map((x,i)=>{let p=Math.floor(S.position/8)*8+i;return `<button data-act="goto" data-index="${p}" class="${i===step?'current ':''}${Object.hasOwn(S.answers,x.id)?'done':''}" ${p>unlocked()?'disabled':''} aria-label="Schritt ${i+1}: ${E(x.title)}">${i+1}</button>`;}).join('')}</div><span class="pill">${E(types[t.type])} | Schritt ${S.position+1} / 72</span></div><section class="card taskcard" data-task="${t.id}"><h2 tabindex="-1" id="task-title">${E(t.title)}</h2><p class="prompt">${E(t.prompt)}</p><div class="task-body">${taskBody(t)}</div><details class="notebox"><summary>${I('note',16)} Eigene Arbeitsnotiz</summary><textarea data-note maxlength="4000" placeholder="Rechenweg, Zwischenwerte oder eine Frage für die Besprechung ...">${E(S.notes[t.id]||'')}</textarea></details><div class="task-actions"><button data-act="back" ${S.position===0?'disabled':''}>${I('back')}Zurück</button><button class="primary" data-act="submit">${I('save')}${S.position===71?'Entscheidung speichern':'Speichern und weiter'}</button></div><p class="status" id="status" role="status"></p></section><nav class="toolbar" aria-label="Hilfen zur Bearbeitung"><button data-act="help">${I('help')}Allgemeine Hilfe</button><button data-act="formulas">${I('book')}Formelsammlung</button><button data-act="calculator">${I('calc')}Taschenrechner</button><button data-act="journal">${I('bag')}Meine Akten</button></nav>${C.done(D,S)===72?`<div class="callout"><strong>Alle Schritte bearbeitet.</strong><p>Prüfe deine Entscheidungen. Erst beim Abschließen werden Punkte, Erklärungen und Musterlösungen freigegeben.</p><button class="primary" data-act="finish">${I('flag')}Mission abschließen</button></div>`:''}<p class="legalhint">${E(t.days.map(d=>'Modul '+String(d).padStart(2,'0')).join(' / '))} | Lernmodell, keine realen Unternehmensdaten. Endbewertung ohne Minuspunkte.</p></main></div>`;}
function answerText(t,a){if(a===undefined)return 'Nicht bearbeitet';if(t.type==='single')return t.options.find(x=>x.id===a)?.text||'';if(t.type==='multi')return t.options.filter(x=>a.includes(x.id)).map(x=>x.text).join('\n');if(t.type==='numbers')return t.fields.map(x=>`${x.label}: ${f(C.parseNumber(a[x.id]))} ${x.unit}`).join('\n');if(t.type==='match')return t.pairs.map(p=>`${p.text} -> ${t.categories.find(x=>x.id===a[p.id])?.text||''}`).join('\n');if(t.type==='order')return a.map((id,i)=>`${i+1}. ${t.items.find(x=>x.id===id)?.text||''}`).join('\n');if(t.type==='inspect')return t.evidence.filter(e=>a.includes(e.id)).map(e=>e.title).join('\n');if(t.type==='dialogue')return t.options.find(x=>x.id===a.choice)?.text||'';if(t.type==='portfolio')return t.items.filter(x=>a.includes(x.id)).map(x=>`${x.name}: ${f(x.price)} Euro`).join('\n');return String(a);}
function refs(t){return t.refs.map(r=>`Modul ${String(r.day).padStart(2,'0')}, ${r.pages}`).join(' | ');}
function reviewRows(filter='all'){const report=C.review(D,S);if(!report)return '';return D.chapters.map((ch,ci)=>{let ts=ch.tasks.filter(t=>filter==='all'||(filter==='open'&&t.points>0&&!report.rows.find(x=>x.id===t.id).correct)||(filter==='reflect'&&t.type==='reflect'));if(!ts.length)return '';return `<section class="gap"><h2>${ci+1}. ${E(ch.title)}</h2>${ts.map(t=>{let r=report.rows.find(x=>x.id===t.id);let mark=t.points?`${f(r.earned)} / ${t.points} Punkte`:'Bearbeitung - ohne Fachpunkte';return `<details class="review-row"><summary><strong>${E(t.title)}</strong><span>${mark}</span></summary><div class="review-content"><p class="small">${E(t.prompt)}</p><div class="answers"><div><small>Deine gespeicherte Entscheidung</small><p>${E(answerText(t,S.answers[t.id]))}</p></div><div><small>${t.type==='reflect'?'Beispiel für die Besprechung':t.type==='dialogue'?'Dein gewählter Weg':'Musterlösung / erwartete Zuordnung'}</small><p>${E(t.type==='dialogue'?answerText(t,S.answers[t.id]):answerText(t,t.solution))}</p></div></div>${r.checks.length?`<p class="small">Teilbewertung: ${r.checks.map((x,i)=>`${i+1}: ${x.ok?'passend':'noch zu klären'}`).join(' | ')}</p>`:''}<p class="explain">${E(t.explanation)}</p>${S.notes[t.id]?`<p class="note-quote small">Deine Arbeitsnotiz: ${E(S.notes[t.id])}</p>`:''}<p class="refs">${E(refs(t))}</p></div></details>`;}).join('')}</section>`;}).join('');}
function reportPage(){const r=C.review(D,S);if(!r){screen='game';return game();}let pct=r.earned/r.maximum*100;return `${header()}<main id="main"><section class="card report-head"><div><div class="eyebrow">Auftrag abgeschlossen | Deine Besprechung</div><h1 class="gap">Die Zahlen haben<br>eine Geschichte.</h1><p>${E(S.avatar.name)}, deine Entscheidungsvorlage ist abgegeben. Jetzt werden die Fachaufgaben ausgewertet. Freie Begründungen und persönliche Schwerpunktentscheidungen bleiben Gesprächsgrundlage, keine automatische Fachnote.</p><div class="row"><button class="primary" data-act="print">${I('print')}Besprechung drucken / PDF</button><button data-act="report-export">${I('download')}Auswertung als JSON</button><button data-act="journal">${I('note')}Meine Arbeitsmappe</button></div></div><div class="score-disc"><strong>${f(pct)} %</strong><small>${f(r.earned)} / ${r.maximum} Fachpunkte</small><small>Keine Minuspunkte</small></div></section><div class="chapter-scores">${D.chapters.map((ch,i)=>{let rs=r.rows.filter(x=>ch.tasks.some(t=>t.id===x.id));let earned=C.round(rs.reduce((s,x)=>s+x.earned,0)),max=ch.tasks.reduce((s,t)=>s+t.points,0);return `<div class="chapter-score"><h3>${i+1}. ${E(ch.title)}</h3><strong>${f(earned)} / ${max}</strong><div class="track"><span style="width:${earned/max*100}%"></span></div><small>Fachpunkte</small></div>`;}).join('')}</div><section class="card"><h2>Dein Weg durch BüroWerk</h2><p><strong>Dein Schwerpunkt:</strong> ${E(routeLabel())}</p><p><strong>Deine Investitionsentscheidung:</strong> ${E(portfolioLabel())}</p><h3>Deine Abschlussbotschaft</h3><p class="note-quote">${E(S.answers['datev-08'])}</p><div class="badges gap"><span class="badge">${I('award',18)} Mission abgeschlossen</span><span class="badge">${I('book',18)} Alle Akten gesichtet</span><span class="badge">${I('note',18)} Eigene Empfehlung verfasst</span>${pct>=80?`<span class="badge">${I('star',18)} Mindestens 80 % Fachpunkte</span>`:''}</div><p class="small muted gap">Die Abzeichen werden erst hier sichtbar. Die ersten drei bestätigen Bearbeitung, nicht automatisch fachliche Richtigkeit. ${Math.floor(S.activeSeconds/60)} aktive Browserminuten wurden lokal gezählt.</p></section><section class="card gap"><div class="row spread"><div><h2>Aufträge gemeinsam durchgehen</h2><p class="muted small">Deine Antworten, Teilpunkte, Erklärungen und Quellen.</p></div><select class="review-filter" aria-label="Auswertung filtern" id="review-filter"><option value="all">Alle Schritte</option><option value="open">Fachaufgaben mit offenen Punkten</option><option value="reflect">Eigene Begründungen</option></select></div><div id="review-rows">${reviewRows()}</div></section><div class="row gap"><button data-act="sources">Quellen und Modellgrenzen</button><button data-act="reset">Neue Mission beginnen</button></div></main>`;}
function render(focus=false){document.body.dataset.theme=S.theme;let html=screen==='creator'?creator():screen==='game'?game():screen==='report'?reportPage():landing();$('#app').innerHTML=`<div class="wrap">${html}</div>`;if(screen==='game'){status();if(focus)$('#task-title').focus({preventScroll:true});}save();}
function modal(title,body){modalReturn=document.activeElement;const m=$('#modal');m.innerHTML=`<div class="dialog-head"><h2 id="dialog-title" tabindex="-1">${E(title)}</h2><button class="icon" data-act="close" aria-label="Schließen">${I('close')}</button></div><div class="dialog-body">${body}</div>`;if(!m.open)m.showModal();$('#dialog-title').focus();}
function closeModal(){const m=$('#modal');m.close();if(modalReturn&&document.contains(modalReturn))modalReturn.focus();}
function guide(){modal('So spielst du',`<p>Du bearbeitest neun Kapitel im fiktiven ersten Geschäftsjahr von BüroWerk. Zum nächsten Schritt gelangst du, sobald deine Eingabe vollständig gespeichert ist - unabhängig davon, ob sie richtig ist.</p><div class="callout"><strong>Die Auswertung wartet bis zum Schluss.</strong><p>Keine grünen oder roten Antwortmarkierungen, keine laufenden Punkte, keine Musterlösungen. Allgemeine Formeln und Hilfen darfst du jederzeit nutzen.</p></div><h3 class="gap">Deine Entscheidungen</h3><p>Frühere Schritte lassen sich vor Abschluss ändern. Speichere Änderungen erneut; es zählt die letzte gespeicherte Antwort, nicht ein heimlich gespeicherter Bestwert. Freitexte, Lesen und Schwerpunktwahl erhalten keine Fachpunkte.</p><h3>Zahlen und Teilpunkte</h3><p>Jedes korrekte Zahlenfeld oder jede passende Zuordnung kann Teilpunkte geben. Bei Mehrfachauswahl ist eine feste Anzahl auszuwählen; falsche Auswahlen ziehen keine Punkte ab. Geldbeträge und Prozentwerte am Ende auf zwei Nachkommastellen runden. 1.000 bedeutet tausend; Dezimalwerte am besten mit Komma schreiben.</p><h3>Pause und Speicher</h3><p>Deine Arbeit wird im lokalen Browserspeicher gesichert, sofern dieser erlaubt ist. Für einen Geräte- oder Browserwechsel exportiere einen JSON-Spielstand. Ein anderer Dateiname oder Browser kann einen anderen Speicherbereich verwenden. Keine Cloud-Synchronisierung und keine automatische Übermittlung.</p><p class="small muted">Die Spieldauer 90-120 Minuten ist eine didaktische Planung, keine gemessene Bearbeitungszeit. Die Illustrationen sind keine echte 3D-Simulation. Offline-Musterlösungen stehen technisch im Quellcode; dies ist kein manipulationssicheres Prüfungssystem.</p>`);}
function sources(){modal('Quellen und Modellgrenzen',`<p>Fachliche Basis: neun aktuelle ReWe1-Master-Skripte (Module 01–09, SKR04 2026) sowie die Dokumentation zu Übungen und Prüfungslogik. Geschichte, Personen und einzelne klar benannte Zahlenvarianten sind Lernspieladaptionen.</p>${D.sources.map(s=>`<p class="source-name small"><strong>Modul ${String(s.day).padStart(2,'0')}</strong> | ${E(s.name)}${S.finished?`<br><a href="${E(s.url)}" target="_blank" rel="noopener noreferrer">Original im verbundenen Drive öffnen (Internet/Anmeldung erforderlich)</a>`:''}</p>`).join('')}<h3>Grenzen</h3>${D.limitations.map(x=>`<p class="small">${E(x)}</p>`).join('')}<p class="small muted">Fachliche Modulbezüge stehen in der Endbesprechung je Auftrag. Originaldateien wurden für dieses Spiel nicht verändert. Die 72 Schritte wiederholen zentrale Inhalte der neun ReWe1-Module; sie ersetzen nicht den vollständigen Kurs.</p>`);}
function journal(){let end=unlocked();let sections=D.chapters.map((c,ci)=>{if(ci*8>end)return '';let doc=c.tasks.find(t=>t.type==='inspect');let entries=doc?(draft(doc)||[]):[];let docs=doc?doc.evidence.filter(e=>entries.includes(e.id)).map(e=>`<details><summary>${E(e.title)}</summary><p>${E(e.body)}</p></details>`).join(''):'';let notes=c.tasks.filter(t=>S.notes[t.id]).map(t=>`<div class="gap"><strong>${E(t.title)}</strong><p class="note-quote">${E(S.notes[t.id])}</p></div>`).join('');return docs||notes?`<section class="card"><h3>${ci+1}. ${E(c.title)}</h3>${docs}${notes}</section>`:'';}).join('');modal('Deine Arbeitsmappe',`<p class="small muted">Nur bereits geöffnete Akten und deine eigenen Notizen. Keine Musterlösungen.</p><div class="callout"><strong>Schwerpunkt:</strong> ${E(routeLabel())}<br><strong>Investitionsentscheidung:</strong> ${E(portfolioLabel())}</div><div class="gap">${sections||'<p>Es wurden noch keine Akten geöffnet oder Notizen angelegt.</p>'}</div>`);}
function calculator(){modal('Taschenrechner',`<label class="field">Deine Rechnung<input id="calc-input" class="calc-screen" autocomplete="off" inputmode="decimal" maxlength="240" placeholder="z. B. (120 - 80) * 25"></label><output class="calc-output" id="calc-output" aria-live="polite"></output><div class="calc-grid">${['7','8','9','/','4','5','6','*','1','2','3','-','0',',','(',')','C','DEL','=','+'].map(x=>`<button data-act="calc-key" data-id="${x}" class="${x==='='?'primary':''}">${x}</button>`).join('')}</div><p class="small muted gap">+, -, *, / und Klammern; keine Formeln aus Aufgaben werden automatisch eingefügt. Mit Dezimalkomma rechnen; 1.000 wird als tausend gelesen. Anzeige bis zu acht Nachkommastellen.</p>`);}
function calcEval(){let n=C.calculate($('#calc-input').value);$('#calc-output').textContent=n===null?'Rechnung prüfen.':new Intl.NumberFormat('de-DE',{maximumFractionDigits:8}).format(n);}
function download(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function printReport(){let r=C.review(D,S);let html;if(!r)html='<h1>BüroWerk UnternehmensMission</h1><p>Die Mission läuft noch. Musterlösungen und Bewertungsbericht werden erst nach Abschluss freigegeben.</p>';else html=`<div class="overview"><h1>BüroWerk - Abschlussbesprechung</h1><p>${E(S.avatar.name)} | ReWe1 Module 01–09 | Version ${E(D.version)}<br>${f(r.earned)} von ${r.maximum} Fachpunkten (${f(r.earned/r.maximum*100)} %). Keine Minuspunkte. Freitexte sind nicht automatisch fachlich benotet.</p><p>Schwerpunkt: ${E(routeLabel())}<br>Priorisierung: ${E(portfolioLabel())}</p></div>${D.chapters.map((c,ci)=>`<h2>${ci+1}. ${E(c.title)}</h2>${c.tasks.map(t=>{let q=r.rows.find(x=>x.id===t.id);return `<section class="print-item"><h3>${E(t.title)} | ${t.points?f(q.earned)+' / '+t.points+' Punkte':'ohne Fachpunkte'}</h3><p>${E(t.prompt)}</p><p><strong>Deine Antwort:</strong> ${E(answerText(t,S.answers[t.id]))}</p>${t.type==='dialogue'?'':`<p><strong>${t.type==='reflect'?'Besprechungsbeispiel':'Musterlösung'}:</strong> ${E(answerText(t,t.solution))}</p>`}<p>${E(t.explanation)}</p>${S.notes[t.id]?`<p><strong>Eigene Notiz:</strong> ${E(S.notes[t.id])}</p>`:''}<small>${E(refs(t))}</small></section>`;}).join('')}`).join('')}<section class="print-sources"><h2>Quellen und Grenzen</h2>${D.sources.map(s=>`<p>Modul ${String(s.day).padStart(2,'0')}: ${E(s.name)}</p>`).join('')}<p>Alle Unternehmenswerte sind Unterrichtsmodelle oder bezeichnete Lernspielannahmen. Keine realen Istdaten. Die drei Bildstile sind SVG-Illustrationen. Dieser Bericht ist eine Lernrückmeldung, keine bescheinigte Prüfungsleistung.</p></section>`;$('#print-root').innerHTML=html;}
function finishRequest(){if(dirtyCount()){modal('Entwürfe noch nicht übernommen',`<p>${dirtyCount()} bereits bearbeitete Schritte haben geänderte Entwürfe. Speichere diese Entscheidungen erneut oder setze den Entwurf zurück, bevor du abschließt.</p><div class="row">${TASKS.filter(t=>changed(t)).map(t=>`<button data-act="open-dirty" data-index="${TASKS.indexOf(t)}">${E(t.title)}</button>`).join('')}</div>`);return;}modal('Deine Mission jetzt abschließen?',`<p>Alle 72 Schritte sind gespeichert. Nach dem Abschluss sind die Entscheidungen festgehalten und alle Punkte, Erklärungen und Musterlösungen sichtbar. Für einen weiteren Versuch startest du eine neue Mission.</p><div class="row"><button class="primary" data-act="finish-confirm">Ja, Abschlussbesprechung öffnen</button><button data-act="close">Noch einmal prüfen</button></div>`);}
function handle(action,b){
 if(action==='close'){closeModal();return;}
 if(action==='theme'){S.theme=b.dataset.id;save();render();if($('#modal').open&&$('#theme-settings'))$('#theme-settings').innerHTML=styles();return;}
 if(action==='start'){screen=S.started?(S.finished?'report':'game'):'creator';render();window.scrollTo(0,0);return;}
 if(action==='begin'){if(!S.avatar.name.trim()){$('#creator-error').textContent='Bitte einen Namen oder Spitznamen eintragen.';$('#player-name').focus();return;}S.avatar.name=S.avatar.name.trim();S.started=true;screen=S.finished?'report':'game';render(true);window.scrollTo(0,0);return;}
 if(action==='home'){save();screen='landing';render();window.scrollTo(0,0);return;}
 if(action==='guide'){guide();return;}if(action==='sources'){sources();return;}if(action==='journal'){journal();return;}if(action==='calculator'){calculator();return;}
 if(action==='settings'){modal('Darstellung und Spielstand',`<h3>Drei Bildstile, dasselbe Spiel</h3><div id="theme-settings">${styles()}</div><p class="small muted gap">Keine inhaltlichen Unterschiede. Alle Entscheidungen bleiben beim Wechsel erhalten.</p><div class="row gap"><button data-act="avatar">${I('person')}Spielfigur</button><button data-act="export">${I('download')}JSON sichern</button><button data-act="import">${I('upload')}JSON laden</button></div><p class="small muted gap">${storageOK?'Lokaler Browserspeicher verfügbar.':'Lokaler Speicher blockiert. Bitte JSON-Sicherungen verwenden.'} Keine Cloud-Übertragung.</p><div class="row gap"><button data-act="sources">Quellen</button><button class="danger" data-act="reset">${I('reset')}Neue Mission</button></div>`);return;}
 if(action==='avatar'){closeModal();screen='creator';render();return;}
 if(action==='export'){save();download(S,'BüroWerk_Spielstand.json');toast('Spielstand als JSON gesichert.');return;}
 if(action==='import'){$('#import-file').click();return;}
 if(action==='report-export'){let r=C.review(D,S);if(!r)return;download({title:D.title,version:D.version,player:S.avatar.name,report:r,answers:TASKS.map(t=>({id:t.id,title:t.title,answer:answerText(t,S.answers[t.id]),solution:answerText(t,t.solution),explanation:t.explanation,sources:refs(t)})),sources:D.sources},'BüroWerk_Abschlussbesprechung.json');return;}
 if(action==='print'){if(!C.review(D,S))return;printReport();window.print();return;}
 if(action==='reset'){modal('Neue Mission beginnen?',`<p>Der aktuelle Spielstand in diesem Browser wird durch eine neue Mission ersetzt. Vorher eine JSON-Sicherung herunterladen? Andere Dateien oder Spielstände werden nicht gelöscht.</p><div class="row"><button data-act="export">Spielstand sichern</button><button class="danger" data-act="reset-confirm">Neue Mission wirklich beginnen</button><button data-act="close">Abbrechen</button></div>`);return;}
 if(action==='reset-confirm'){closeModal();S=C.newState(D,Math.floor(Math.random()*4294967295));screen='creator';render();window.scrollTo(0,0);return;}
 if(action==='formulas'){modal('Formeln und allgemeine Begriffe',`<p class="small muted">Nachschlagen ist erlaubt. Hier stehen allgemeine Regeln, keine ausgefüllten Lösungen der Mission.</p>${D.formulas.map(g=>`<details><summary>${E(g.title)}</summary><p>${E(g.text)}</p></details>`).join('')}`);return;}
 if(action==='help'&&screen==='game'){modal('Allgemeine Hilfe',`<p>${E(active().help)}</p><p class="small muted">Lies zuerst, welche Periode, Einheit und Vergleichsbasis gefragt ist. Konkrete Ergebniswerte und die Bewertung erscheinen erst in der Abschlussbesprechung.</p><button data-act="formulas">Formelsammlung öffnen</button>`);return;}
 if(action==='calc-key'){const x=b.dataset.id,input=$('#calc-input');if(x==='='){calcEval();return;}if(x==='C')input.value='';else if(x==='DEL')input.value=input.value.slice(0,-1);else input.value+=x;input.focus();return;}
 if(action==='finish'){finishRequest();return;}
 if(action==='finish-confirm'){if(dirtyCount())return;let result=C.finish(D,S);if(result.ok){closeModal();save();screen='report';render();window.scrollTo(0,0);}return;}
 if(action==='open-dirty'){closeModal();S.position=Number(b.dataset.index);screen='game';render(true);return;}
 if(screen!=='game')return;
 let t=active(),d=draft(t);
 if(action==='evidence'){let ev=t.evidence.find(x=>x.id===b.dataset.id);if(!ev)return;if(!d.includes(ev.id))d.push(ev.id);queueSave();render();modal(ev.title,`<div class="eyebrow">${E(ev.kind)} | BüroWerk-Lernfall</div><p class="gap">${E(ev.body)}</p><button class="primary" data-act="close">Gelesen - zurück zum Auftrag</button>`);return;}
 if(action==='dialogue'){S.drafts[t.id]={choice:b.dataset.id,read:false};queueSave();render();return;}
 if(action==='order'){let i=Number(b.dataset.index),j=i+Number(b.dataset.direction);if(j>=0&&j<d.length){[d[i],d[j]]=[d[j],d[i]];queueSave();render();}return;}
 if(action==='goto'||action==='chapter'||action==='back'){let target=action==='back'?S.position-1:action==='chapter'?Number(b.dataset.index)*8:Number(b.dataset.index);if(target>=0&&target<=unlocked()){S.position=target;render(true);window.scrollTo({top:0,behavior:'instant'});}return;}
 if(action==='submit'){let result=C.submit(D,S,t,d);if(!result.ok){status(result.message,true);return;}save();if(S.position<71){let next=S.position+1,newChapter=next%8===0;S.position=next;render(true);window.scrollTo({top:newChapter?0:Math.max(0,document.querySelector('.taskcard').offsetTop-20),behavior:'instant'});if(newChapter)toast('Kapitel gespeichert. Dein Auftrag geht weiter.');}else{render();status('Alle Entscheidungen sind gespeichert. Du kannst jetzt die Mission abschließen.');}return;}
}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(b&&!b.disabled)handle(b.dataset.act,b);});
document.addEventListener('input',e=>{let el=e.target;if(el.dataset.avatar){let k=el.dataset.avatar;S.avatar[k]=k==='name'?el.value:Number(el.value);queueSave();let p=$('#avatar-preview');if(p)p.innerHTML=A.avatar(S.avatar,S.theme,'Deine Spielfigur');return;}if(screen!=='game'||S.finished)return;let t=active(),d=draft(t);if(el.hasAttribute('data-number'))d[el.dataset.number]=el.value;else if(el.hasAttribute('data-reflect'))S.drafts[t.id]=el.value;else if(el.hasAttribute('data-note'))S.notes[t.id]=el.value;else return;queueSave();if(!el.hasAttribute('data-note'))status();});
document.addEventListener('change',e=>{let el=e.target;if(el.id==='review-filter'){$('#review-rows').innerHTML=reviewRows(el.value);return;}if(el.dataset.avatar){S.avatar[el.dataset.avatar]=el.dataset.avatar==='name'?el.value:Number(el.value);queueSave();let p=$('#avatar-preview');if(p)p.innerHTML=A.avatar(S.avatar,S.theme,'Deine Spielfigur');return;}if(screen!=='game'||S.finished)return;let t=active(),d=draft(t);if(el.hasAttribute('data-choice')){S.drafts[t.id]=t.type==='single'?el.dataset.choice:[...document.querySelectorAll('[data-choice]:checked')].map(x=>x.dataset.choice);}else if(el.hasAttribute('data-portfolio'))S.drafts[t.id]=[...document.querySelectorAll('[data-portfolio]:checked')].map(x=>x.dataset.portfolio);else if(el.hasAttribute('data-match'))d[el.dataset.match]=el.value;else if(el.hasAttribute('data-read'))d.read=el.checked;else return;queueSave();status();});
$('#import-file').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>1000000){toast('Die Spielstanddatei ist zu groß.');return;}try{let r=C.restore(JSON.parse(await file.text()),D);if(!r.ok){toast(r.error);return;}modal('Spielstand übernehmen?',`<p>Gefundener Stand von ${E(r.state.avatar.name||'ohne Namen')}: ${C.done(D,r.state)} / 72 Schritte. Der aktuelle lokale Stand wird ersetzt; deine Dateien bleiben unverändert.</p><div class="row"><button id="confirm-import" class="primary">Spielstand übernehmen</button><button data-act="close">Abbrechen</button></div>`);$('#confirm-import').addEventListener('click',()=>{S=r.state;S.position=Math.min(S.position,unlocked());closeModal();save();screen=S.finished?'report':S.started?'game':'creator';render();toast('Spielstand geladen.');});}catch(_){toast('Die Datei ist kein lesbarer Spielstand. Dein bisheriger Stand bleibt erhalten.');}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){let r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
document.addEventListener('keydown',e=>{if($('#modal').open&&e.key==='Enter'&&e.target.id==='calc-input'){e.preventDefault();calcEval();}});
window.addEventListener('beforeunload',save);window.addEventListener('beforeprint',printReport);document.addEventListener('visibilitychange',save);
setInterval(()=>{if(S.started&&!S.finished&&screen==='game'&&!document.hidden&&!$('#modal').open){S.activeSeconds+=1;if(S.activeSeconds%15===0)save();}},1000);
render();
})();
</script></body></html>
